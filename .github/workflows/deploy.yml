name: Deploy

# Deploy only after the CI workflow completes successfully on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow manual redeploy from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip when triggered by a failed CI run. Manual dispatch has no workflow_run payload.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Start ssh-agent with the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust the server host key
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to the server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        # --delete keeps the remote tree identical to the repo, but protected paths
        # (server-only .env, evidence volume, venv) are excluded so they survive.
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='.env' \
            --exclude='.env.worker' \
            --exclude='var/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ "$SSH_USER@$SSH_HOST:/home/ubuntu/metaphor-back/"

      - name: Install dependencies and restart the service
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          cd /home/ubuntu/metaphor-back
          uv sync --locked --group worker
          # Schema first: new code may need columns from the new revision.
          uv run alembic upgrade head
          sudo /usr/bin/systemctl restart metaphor-back.service
          if systemctl list-unit-files metaphor-worker.service --no-legend | grep -q '^metaphor-worker.service'; then
            sudo /usr/bin/systemctl restart metaphor-worker.service
            # Type=exec only confirms exec succeeded. Give startup checks time to finish.
            sleep 25
            systemctl is-active --quiet metaphor-worker.service
            test "$(systemctl show metaphor-worker.service -p NRestarts --value)" = "0"
          else
            echo 'Worker unit is not installed; follow docs/deploy.md for one-time setup.'
          fi
          REMOTE

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$SSH_HOST:8000/api/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP 200)."
              curl -s "http://$SSH_HOST:8000/api/v1/health"; echo
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 3s..."
            sleep 3
          done
          echo "Health check failed after 10 attempts."
          exit 1
