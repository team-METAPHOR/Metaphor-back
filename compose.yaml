services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: metaphor
      POSTGRES_PASSWORD: metaphor
      POSTGRES_DB: metaphor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaphor -d metaphor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
