[project]
name = "metaphor-back"
version = "0.1.0"
description = "Backend API for the Metaphor bug reproduction platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    "metaphor-core-engine",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]
worker = [
    "metaphor-core-engine[browser,video]",
]

[tool.uv.sources]
# Built from team-METAPHOR/Core_engine@48ec7bb (see vendor/README.md).
metaphor-core-engine = { path = "vendor/metaphor_core_engine-0.8.3-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "e2e: needs a real model key and Chromium",
    "browser: drives Chromium (playwright install chromium --only-shell)",
]
addopts = "-m 'not e2e'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
